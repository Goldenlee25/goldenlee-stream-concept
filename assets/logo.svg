<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <style>
      .logo-text { font-family: Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #00ff41; letter-spacing: 2px; }
      .logo-accent { fill: none; stroke: #00ff41; stroke-width: 2; }
    </style>
  </defs>
  
  <!-- Decorative hexagon border -->
  <g class="logo-accent">
    <polygon points="100,20 160,50 160,150 100,180 40,150 40,50" />
  </g>
  
  <!-- Goldenlee text -->
  <text x="100" y="110" text-anchor="middle" class="logo-text">GL</text>
  
  <!-- Corner accent marks -->
  <line x1="50" y1="40" x2="70" y2="40" stroke="#00ff41" stroke-width="2"/>
  <line x1="50" y1="40" x2="50" y2="60" stroke="#00ff41" stroke-width="2"/>
  
  <line x1="150" y1="40" x2="130" y2="40" stroke="#00ff41" stroke-width="2"/>
  <line x1="150" y1="40" x2="150" y2="60" stroke="#00ff41" stroke-width="2"/>
  
  <line x1="50" y1="160" x2="70" y2="160" stroke="#00ff41" stroke-width="2"/>
  <line x1="50" y1="160" x2="50" y2="140" stroke="#00ff41" stroke-width="2"/>
  
  <line x1="150" y1="160" x2="130" y2="160" stroke="#00ff41" stroke-width="2"/>
  <line x1="150" y1="160" x2="150" y2="140" stroke="#00ff41" stroke-width="2"/>
</svg>
